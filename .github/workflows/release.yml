name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download aviutl2_sdk
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/Kenkun-Mizuki/aviutl2_sdk.git $env:TEMP/aviutl2_sdk
          echo "AVIUTL2_SDK=$env:TEMP/aviutl2_sdk" >> $env:GITHUB_ENV

      - name: Build & Package
        shell: pwsh
        run: |
          .\package.ps1 -Version ${{ github.ref_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
