name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download aviutl2_sdk
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/aviutl2/aviutl2_sdk_mirror.git $env:TEMP/aviutl2_sdk
          $sdkPath = "$env:TEMP/aviutl2_sdk/include/aviutl2_sdk"
          echo "AVIUTL2_SDK=$sdkPath" >> $env:GITHUB_ENV

      - name: Build & Package
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.1" }
          .\package.ps1 -Version $tag

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
